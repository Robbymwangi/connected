# Development environment for the API, run through Laravel Sail (vendor/bin/sail).
# Generated by `sail:install --with=pgsql` and then edited: the frontend is not in
# here (it runs natively on Node, see the root README), so the Vite port mapping is
# gone, the app service is named through APP_SERVICE in .env, the app waits for
# Postgres to be healthy, and a queue worker runs from the first `sail up` because
# report PDFs are queued jobs. RustFS stands in for S3 for those PDFs (build plan 4.4), as
# Sail's own stub has it, since MinIO's images left Docker Hub in September 2026; rustfs-bucket
# creates the bucket once RustFS is healthy, then exits.
name: connected

services:
    api:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    queue:
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=90']
        # The database queue needs the jobs table, so the worker dies on a fresh
        # database until `sail artisan migrate` has run; restart until it sticks.
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: '/data'
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:-sail}'
            RUSTFS_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
            RUSTFS_LOG_LEVEL: 'info'
        volumes:
            - 'sail-rustfs:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'sh', '-c', 'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
    # Creates the bucket with a signed S3 PUT from RustFS's own image (its curl signs SigV4), so no
    # client image is needed: 200 is created, 409 is already there.
    rustfs-bucket:
        image: 'rustfs/rustfs:latest'
        environment:
            AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-sail}'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
            AWS_DEFAULT_REGION: '${AWS_DEFAULT_REGION:-us-east-1}'
            AWS_BUCKET: '${AWS_BUCKET:-reports}'
        entrypoint:
            - /bin/sh
            - -c
            - >-
                code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
                --aws-sigv4 "aws:amz:$$AWS_DEFAULT_REGION:s3"
                --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY"
                "http://rustfs:9000/$$AWS_BUCKET");
                case "$$code" in 200|409) echo "bucket $$AWS_BUCKET ready";; *) echo "bucket $$AWS_BUCKET: HTTP $$code"; exit 1;; esac
        networks:
            - sail
        depends_on:
            rustfs:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-rustfs:
        driver: local
