// Security updates on the API host, installed by deploy/release.sh as
// /etc/apt/apt.conf.d/52connected-auto-upgrades.
//
// Ubuntu's unattended-upgrades is on by default but takes only Ubuntu's own security updates, and
// PHP comes from the ondrej/php PPA (infra/production/user-data.sh), so a PHP fix would never
// arrive. This adds that PPA to the origins it may upgrade from. The php8.4-fpm package restarts
// its own service on upgrade, and the queue worker picks up the new binary within the hour
// (--max-time=3600 in connected-queue.service).

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Allowed-Origins:: "LP-PPA-ondrej-php:${distro_codename}";
