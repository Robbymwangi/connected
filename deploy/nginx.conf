# The API host's one site (build plan 5.2, ADR 0015). Every request arrives from CloudFront; the
# security group admits nothing else, and the secret header below refuses anything that reached
# this address some other way. Placeholders in braces are filled by deploy/release.sh from the
# settings in Parameter Store, so the secret is never in the repository.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/connected/current/api/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    if ($http_x_origin_verify != "{ORIGIN_SECRET}") {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # CloudFront talks to this host in plain HTTP and sends the origin's own name as Host. The
        # browser used HTTPS and the app's address, so Laravel is told those: redirects and links
        # then point at the app, not at this host.
        fastcgi_param HTTP_HOST {APP_HOST};
        fastcgi_param SERVER_NAME {APP_HOST};
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
